[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-llm-gateway-sdk"
version = "0.1.0"
description = "Python SDK for the ZK LLM Gateway: encrypted envelopes, token-class padding, and ZK-ready usage tickets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Your Org", email = "dev@your-org.example" }
]
keywords = ["privacy", "zk", "llm", "gateway", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "cryptography>=41.0.0",
  "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/your-org/zk-llm-gateway-python-sdk"
Repository = "https://github.com/your-org/zk-llm-gateway-python-sdk"
Issues = "https://github.com/your-org/zk-llm-gateway-python-sdk/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
