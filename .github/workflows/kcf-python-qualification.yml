name: KCF Python SDK Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and qualification tools
        run: python -m pip install -e . pytest ruff
      - name: Ruff
        run: ruff check --select F,E9 src/zk_llm_gateway_sdk/prepared.py src/zk_llm_gateway_sdk/prepared_transport.py tests/test_prepared.py tests/test_prepared_policy.py
      - name: Full tests
        run: pytest -q
      - name: Prepared-request focused tests
        run: pytest -q tests/test_prepared.py tests/test_prepared_policy.py
